name: Official Release and Platform Fanout

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing official release tag (e.g. v0.7.0)
        required: true
        type: string
      platform:
        description: Re-publish one platform without rebuilding, or all
        required: true
        type: choice
        default: all
        options: [all, hangar, modrinth, curseforge]

permissions:
  contents: read

concurrency:
  group: official-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'x-oOvOo-x/DDS-Manager' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {velocity: '3.4.0', java: '21'}
          - {velocity: '3.5.1', java: '21'}
          - {velocity: '4.0.0', java: '25'}
          - {velocity: '4.1.0', java: '25'}
          - {velocity: '4.1.1', java: '25'}
          - {velocity: '4.2.0', java: '25'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew clean build --no-daemon --stacktrace -PvelocityVersion=${{ matrix.velocity }} -PjavaToolchainVersion=${{ matrix.java }} -PjavaRelease=17

  prepare:
    needs: [verify]
    if: >-
      always() && github.repository == 'x-oOvOo-x/DDS-Manager' &&
      (github.event_name == 'workflow_dispatch' || needs.verify.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout official tag (never Dev)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        if: github.event_name == 'push'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@v4
        if: github.event_name == 'push'
      - uses: gradle/actions/setup-gradle@v4
        if: github.event_name == 'push'

      - name: Validate published tag and provenance
        id: version
        shell: bash
        env:
          REQUEST_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$REQUEST_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected stable tag vX.Y.Z"; exit 1; }
          ver="${REQUEST_TAG#v}"
          actual="$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')"
          [[ "$actual" == "$ver" ]] || { echo "Tag/version mismatch: $REQUEST_TAG / $actual"; exit 1; }
          test -s "docs/releases/$ver.md"
          test -f "LICENSE"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "Tag is not in Public main history"; exit 1; }
          [[ "$(git rev-list -n 1 "$REQUEST_TAG")" == "$(git rev-parse HEAD)" ]]
          echo "tag=$REQUEST_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Verify platform metadata file is present
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool scripts/release-platforms.json >/dev/null

      - name: Build verified official Shadow JAR once
        if: github.event_name == 'push'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ./gradlew clean shadowJar verifyDistribution --no-daemon --stacktrace -PvelocityVersion=3.4.0 -PjavaToolchainVersion=21 -PjavaRelease=17
          mkdir -p dist
          test -f "build/libs/DDS-Manager-$VERSION.jar"
          cp "build/libs/DDS-Manager-$VERSION.jar" dist/
          (cd dist && sha256sum "DDS-Manager-$VERSION.jar" > "DDS-Manager-$VERSION.jar.sha256")

      - name: Create GitHub Release without replacing published assets
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            mkdir -p prior
            gh release download "$TAG" --dir prior \
              --pattern "DDS-Manager-$VERSION.jar" \
              --pattern "DDS-Manager-$VERSION.jar.sha256"
            test -f "prior/DDS-Manager-$VERSION.jar"
            test -f "prior/DDS-Manager-$VERSION.jar.sha256"
            cmp "prior/DDS-Manager-$VERSION.jar.sha256" "dist/DDS-Manager-$VERSION.jar.sha256"
            cmp "prior/DDS-Manager-$VERSION.jar" "dist/DDS-Manager-$VERSION.jar"
            echo "Existing GitHub Release is identical; no asset replaced"
          else
            gh release create "$TAG" --verify-tag --title "DDS Manager $VERSION" \
              --notes-file "docs/releases/$VERSION.md" \
              "dist/DDS-Manager-$VERSION.jar" \
              "dist/DDS-Manager-$VERSION.jar.sha256"
          fi

      - name: Check existing GitHub Release on manual retry (no rebuild)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null
          mkdir -p dist
          gh release download "$TAG" --dir dist --pattern "DDS-Manager-$VERSION.jar" --pattern "DDS-Manager-$VERSION.jar.sha256"
          (cd dist && sha256sum -c "DDS-Manager-$VERSION.jar.sha256")

  hangar:
    needs: prepare
    if: >-
      needs.prepare.result == 'success' &&
      (github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'hangar')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: ./.github/actions/publish-platform
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
          HANGAR_PROJECT: ${{ vars.HANGAR_PROJECT }}
        with:
          platform: hangar
          tag: ${{ needs.prepare.outputs.tag }}
          version: ${{ needs.prepare.outputs.version }}

  modrinth:
    needs: prepare
    if: >-
      needs.prepare.result == 'success' &&
      (github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'modrinth')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: ./.github/actions/publish-platform
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_SLUG: ${{ vars.MODRINTH_PROJECT_SLUG }}
        with:
          platform: modrinth
          tag: ${{ needs.prepare.outputs.tag }}
          version: ${{ needs.prepare.outputs.version }}

  curseforge:
    needs: prepare
    if: >-
      needs.prepare.result == 'success' &&
      (github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'curseforge')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: ./.github/actions/publish-platform
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
        with:
          platform: curseforge
          tag: ${{ needs.prepare.outputs.tag }}
          version: ${{ needs.prepare.outputs.version }}

  summary:
    if: always() && github.repository == 'x-oOvOo-x/DDS-Manager'
    needs: [prepare, hangar, modrinth, curseforge]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize independently completed publishing
        env:
          PREPARE: ${{ needs.prepare.result }}
          HANGAR: ${{ needs.hangar.result }}
          MODRINTH: ${{ needs.modrinth.result }}
          CURSEFORGE: ${{ needs.curseforge.result }}
        run: |
          {
            echo "### Official platform publishing results"
            echo "| Job | Result |"
            echo "|---|---|"
            for name in PREPARE HANGAR MODRINTH CURSEFORGE; do
              echo "| $name | ${!name} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          test "$PREPARE" = success
          for name in HANGAR MODRINTH CURSEFORGE; do
            result="${!name}"
            if [ "$result" = failure ] || [ "$result" = cancelled ]; then
              echo "$name failed; other platforms continued independently" >&2
              exit 1
            fi
          done

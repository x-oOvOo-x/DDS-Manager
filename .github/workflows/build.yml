name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {velocity: '3.4.0', java: '21'}
          - {velocity: '3.5.1', java: '21'}
          - {velocity: '4.0.0', java: '25'}
          - {velocity: '4.1.0', java: '25'}
          - {velocity: '4.1.1', java: '25'}
          - {velocity: '4.2.0', java: '25'}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify (Java 17 target)
        run: ./gradlew clean build --no-daemon --stacktrace -PvelocityVersion=${{ matrix.velocity }} -PjavaToolchainVersion=${{ matrix.java }} -PjavaRelease=17

  publish:
    # No upload on public main pushes or PRs; only a manually created v* tag.
    needs: compatibility
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'x-oOvOo-x/DDS-Manager' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4

      - name: Verify tag, main revision and release contents
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid stable release version'; exit 1; }
          [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo 'Tag does not match version'; exit 1; }
          [[ -s "docs/releases/$version.md" ]] || { echo 'Missing approved release notes'; exit 1; }
          for file in LICENSE THIRD_PARTY_NOTICES.md LICENSES/GSON-APACHE-2.0.txt; do
            [[ -f "$file" ]] || { echo "Missing $file"; exit 1; }
          done
          [[ "$(find src/main/resources/lang -maxdepth 1 -name '*.json' -type f | wc -l)" -eq 9 ]] || { echo 'Expected nine language packs'; exit 1; }
          git fetch --no-tags origin main
          [[ "$(git rev-parse FETCH_HEAD)" == "$GITHUB_SHA" ]] || { echo 'Tag must point to the current public main'; exit 1; }
          {
            echo "version=$version"
            echo 'notes<<DDS_NOTES_EOF'
            cat "docs/releases/$version.md"
            echo 'DDS_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Verify all platform API tokens are configured
        env:
          HANGAR_TOKEN: ${{ secrets.HANGAR_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for name in HANGAR_TOKEN MODRINTH_TOKEN CURSEFORGE_TOKEN; do
            [[ -n "$(printenv "$name")" ]] || { echo "::error::Missing $name"; exit 1; }
          done

      - name: Build single verified Velocity distribution
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean shadowJar verifyDistribution --no-daemon --stacktrace -PvelocityVersion=3.4.0 -PjavaToolchainVersion=21 -PjavaRelease=17
          version="${{ steps.metadata.outputs.version }}"
          test -s "build/libs/DDS-Manager-$version.jar"
          mkdir -p dist
          cp "build/libs/DDS-Manager-$version.jar" LICENSE THIRD_PARTY_NOTICES.md LICENSES/GSON-APACHE-2.0.txt dist/
          (cd dist && sha256sum "DDS-Manager-$version.jar" > "DDS-Manager-$version.jar.sha256")

      - name: Publish GitHub Release
        id: github_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; resuming asset upload"
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
              --title "DDS Manager ${{ steps.metadata.outputs.version }}" \
              --notes-file "docs/releases/${{ steps.metadata.outputs.version }}.md"
          fi

      - name: Publish Modrinth
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          modrinth-id: dds-manager
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/DDS-Manager-${{ steps.metadata.outputs.version }}.jar
          version: ${{ steps.metadata.outputs.version }}
          name: DDS Manager ${{ steps.metadata.outputs.version }}
          version-type: release
          changelog-file: docs/releases/${{ steps.metadata.outputs.version }}.md
          loaders: velocity
          environment: server
          game-versions: '>=1.14.4 <=26.3'
          game-version-filter: releases
          fail-mode: fail

      - name: Publish CurseForge
        if: ${{ always() && steps.github_release.outcome == 'success' }}
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          curseforge-id: '1697972'
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/DDS-Manager-${{ steps.metadata.outputs.version }}.jar
          version: ${{ steps.metadata.outputs.version }}
          name: DDS Manager ${{ steps.metadata.outputs.version }}
          version-type: release
          changelog-file: docs/releases/${{ steps.metadata.outputs.version }}.md
          loaders: velocity
          environment: server
          game-versions: '>=1.14.4 <=26.3'
          game-version-filter: releases
          fail-mode: fail

      - name: Publish PaperMC Hangar (Velocity)
        if: ${{ always() && steps.github_release.outcome == 'success' }}
        uses: milkdrinkers/Hangar-Publish@v2
        with:
          api_token: ${{ secrets.HANGAR_TOKEN }}
          slug: DDS-Manager
          version: ${{ steps.metadata.outputs.version }}
          channel: Release
          description: ${{ steps.metadata.outputs.notes }}
          files: |
            [
              {
                "path": "dist/DDS-Manager-${{ steps.metadata.outputs.version }}.jar",
                "platforms": ["VELOCITY"]
              }
            ]
          platform_dependencies: |
            {
              "VELOCITY": ["3.4.0", "3.5.1", "4.0.0", "4.1.0", "4.1.1", "4.2.0"]
            }

name: build

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - velocity: '3.6.0-SNAPSHOT'
            java: '21'
            toolchain: '21'
          - velocity: '4.0.0'
            java: '25'
            toolchain: '25'
          - velocity: '4.1.0'
            java: '25'
            toolchain: '25'
          - velocity: '4.1.1'
            java: '25'
            toolchain: '25'
          - velocity: '4.2.0'
            java: '25'
            toolchain: '25'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew clean build --stacktrace -PvelocityVersion=${{ matrix.velocity }} -PjavaToolchainVersion=${{ matrix.toolchain }} -PjavaRelease=21

  publish:
    needs: compatibility
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version=//p' gradle.properties)"
          test -n "$VERSION"
          case "$VERSION" in *-SNAPSHOT) echo "Snapshot versions cannot be released"; exit 1;; esac
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build release jar
        if: steps.version.outputs.exists != 'true'
        run: ./gradlew clean shadowJar verifyDistribution --stacktrace
      - name: Prepare release assets
        if: steps.version.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$JAR"
          cp "$JAR" "dist/DDS-Manager-$VERSION.jar"
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          sha256sum "dist/DDS-Manager-$VERSION.jar" > "dist/DDS-Manager-$VERSION.jar.sha256"
      - name: Publish release
        if: steps.version.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          gh release create "$TAG" dist/* --verify-tag --title "DDS Manager $VERSION" --notes $'- 移除对 Velocity 全局 server channel initializer 的替换，改为 PostLogin 后按玩家注入协议处理器。\n- 消除 DDS 触发的 “The server channel initializer has been replaced” 启动警告。\n- 保留首次 Join Game、同服 Respawn 维度更新、跨服 Tab 与真实 Ping 行为。\n- 发布包附带 SHA-256、LICENSE 与 THIRD_PARTY_NOTICES。'

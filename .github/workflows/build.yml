name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {velocity: '3.4.0', java: '21'}
          - {velocity: '3.5.1', java: '21'}
          - {velocity: '4.0.0', java: '25'}
          - {velocity: '4.1.0', java: '25'}
          - {velocity: '4.1.1', java: '25'}
          - {velocity: '4.2.0', java: '25'}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify (Java 17 target)
        run: ./gradlew clean build --no-daemon --stacktrace -PvelocityVersion=${{ matrix.velocity }} -PjavaToolchainVersion=${{ matrix.java }} -PjavaRelease=17

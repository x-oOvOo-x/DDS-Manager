name: build

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - velocity: '3.6.0-SNAPSHOT'
            java: '21'
            toolchain: '21'
          - velocity: '4.0.0'
            java: '25'
            toolchain: '25'
          - velocity: '4.1.0'
            java: '25'
            toolchain: '25'
          - velocity: '4.1.1'
            java: '25'
            toolchain: '25'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew clean build --stacktrace -PvelocityVersion=${{ matrix.velocity }} -PjavaToolchainVersion=${{ matrix.toolchain }} -PjavaRelease=21
      - uses: actions/upload-artifact@v4
        if: matrix.java == '21'
        with:
          name: DDS-Manager
          path: |
            build/libs/*.jar
            !build/libs/*-plain.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

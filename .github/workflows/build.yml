name: build

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - velocity: '3.6.0-SNAPSHOT'
            java: '21'
            toolchain: '21'
          - velocity: '4.0.0'
            java: '25'
            toolchain: '25'
          - velocity: '4.1.0'
            java: '25'
            toolchain: '25'
          - velocity: '4.1.1'
            java: '25'
            toolchain: '25'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew clean build --stacktrace -PvelocityVersion=${{ matrix.velocity }} -PjavaToolchainVersion=${{ matrix.toolchain }} -PjavaRelease=21

  publish:
    needs: compatibility
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version=//p' gradle.properties)"
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build release jar
        if: ${{ steps.version.outputs.exists != 'true' }}
        run: ./gradlew clean shadowJar verifyDistribution --stacktrace
      - name: Publish release
        if: ${{ steps.version.outputs.exists != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$JAR"
          cp "$JAR" "DDS-Manager-$VERSION.jar"
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          gh release create "$TAG" "DDS-Manager-$VERSION.jar" --verify-tag --prerelease --title "DDS Manager $VERSION" --notes $'- 修复跨服聊天来源服务器标签与点击切服。\n- 修复跨服 TAB 延迟显示并优化连接、离开与切服提示。'
